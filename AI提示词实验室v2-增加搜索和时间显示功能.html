<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 提示词实验室 v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex flex-col md:flex-row min-h-screen">
        <aside id="sidebar" class="w-full md:w-1/6 bg-gray-800 text-white transition-all duration-300 flex-shrink-0">
            <div class="p-6 border-b border-gray-700">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-flask text-blue-400"></i>
                    提示词实验室
                </h2>
            </div>
            <nav class="p-4">
                <h3 class="text-gray-400 text-sm font-semibold mb-3 uppercase tracking-wider">提示词分类</h3>
                <ul id="categoryList" class="space-y-2">
                    <li>
                        <button onclick="filterCategory('all')" class="category-btn w-full text-left px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors flex items-center gap-3" data-category="all">
                            <i class="fas fa-th-large"></i>
                            <span>全部</span>
                            <span id="count-all" class="ml-auto bg-gray-600 px-2 py-0.5 rounded-full text-xs">0</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="filterCategory('编程')" class="category-btn w-full text-left px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors flex items-center gap-3" data-category="编程">
                            <i class="fas fa-code text-green-400"></i>
                            <span>编程</span>
                            <span id="count-编程" class="ml-auto bg-gray-600 px-2 py-0.5 rounded-full text-xs">0</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="filterCategory('文案')" class="category-btn w-full text-left px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors flex items-center gap-3" data-category="文案">
                            <i class="fas fa-pen-fancy text-purple-400"></i>
                            <span>文案</span>
                            <span id="count-文案" class="ml-auto bg-gray-600 px-2 py-0.5 rounded-full text-xs">0</span>
                        </button>
                    </li>
                    <li>
                        <button onclick="filterCategory('数据分析')" class="category-btn w-full text-left px-4 py-2 rounded-lg hover:bg-gray-700 transition-colors flex items-center gap-3" data-category="数据分析">
                            <i class="fas fa-chart-line text-yellow-400"></i>
                            <span>数据分析</span>
                            <span id="count-数据分析" class="ml-auto bg-gray-600 px-2 py-0.5 rounded-full text-xs">0</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 bg-gray-100 flex flex-col h-screen overflow-hidden">
            <header class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex-shrink-0">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                    <div class="flex items-center gap-4 flex-1">
                        <button onclick="toggleSidebar()" class="md:hidden text-gray-600 hover:text-gray-900">
                            <i class="fas fa-bars text-xl"></i>
                        </button>
                        <h1 class="text-2xl font-bold text-gray-800 whitespace-nowrap">提示词库</h1>
                        
                        <div class="relative w-full max-w-md ml-4">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <i class="fas fa-search"></i>
                            </span>
                            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜索提示词标题或内容..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm">
                        </div>
                    </div>
                    
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-md hover:shadow-lg flex-shrink-0">
                        <i class="fas fa-plus"></i>
                        新建提示词
                    </button>
                </div>
            </header>

            <div class="p-6 flex-1 overflow-y-auto">
                <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    </div>
                
                <div id="emptyState" class="hidden text-center py-20">
                    <i class="fas fa-search text-6xl text-gray-300 mb-4"></i>
                    <h3 class="text-xl font-semibold text-gray-500 mb-2">未找到匹配的提示词</h3>
                    <p class="text-gray-400 mb-6">换个关键词，或者切换分类试试看</p>
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-800">新建提示词</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[calc(90vh-140px)]">
                <form id="promptForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">标题 *</label>
                        <input type="text" id="promptTitle" required placeholder="输入提示词标题" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">分类 *</label>
                        <select id="promptCategory" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                            <option value="">选择分类</option>
                            <option value="编程">编程</option>
                            <option value="文案">文案</option>
                            <option value="数据分析">数据分析</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">提示词内容 *</label>
                        <textarea id="promptContent" required rows="8" placeholder="输入提示词内容，使用 [主题] 这样的占位符" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"></textarea>
                    </div>
                </form>
            </div>
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 font-medium transition-colors">取消</button>
                <button onclick="savePrompt()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors">保存</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <span id="toastMessage"></span>
    </div>

    <script>
        const defaultPrompts = [
            { id: 1, title: "Python 代码优化专家", category: "编程", content: "你是一位资深的 Python 开发专家。请帮我优化代码...", updatedAt: Date.now() },
            { id: 2, title: "爆款标题生成器", category: "文案", content: "请为[主题]生成5个吸引人的爆款标题...", updatedAt: Date.now() }
        ];

        let prompts = [];
        let currentFilter = 'all';
        let searchQuery = ''; // 【新增】保存当前的搜索文字
        let editingId = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadPrompts();
            renderCards();
            updateCategoryCounts();
        });

        function loadPrompts() {
            const stored = localStorage.getItem('aiPrompts');
            if (stored) {
                prompts = JSON.parse(stored);
            } else {
                prompts = [...defaultPrompts];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('aiPrompts', JSON.stringify(prompts));
        }

        // 【新增功能2】：时间转换函数，把时间戳翻译成 YYYY-MM-DD HH:MM
        function formatTime(timestamp) {
            if (!timestamp) return "时间未知";
            const date = new Date(timestamp);
            const Y = date.getFullYear();
            const M = String(date.getMonth() + 1).padStart(2, '0');
            const D = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            return `${Y}-${M}-${D} ${h}:${m}`;
        }

        // 【新增功能1的联动】：当搜索框输入字时，更新 searchQuery 并重新画卡片
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderCards();
        }

        // 渲染卡片：集成了分类过滤和关键词搜索
        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const emptyState = document.getElementById('emptyState');
            
            // 双重过滤：1. 分类匹配 且 2. 搜索文本匹配
            let filteredPrompts = prompts.filter(p => {
                const matchesCategory = (currentFilter === 'all' || p.category === currentFilter);
                const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     p.content.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            if (filteredPrompts.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                container.innerHTML = filteredPrompts.map(prompt => `
                    <div class="bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 border border-gray-200 overflow-hidden group h-80 flex flex-col justify-between">
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between mb-3">
                                    <span class="px-3 py-1 rounded-full text-xs font-medium ${getCategoryColor(prompt.category)}">
                                        ${prompt.category}
                                    </span>
                                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onclick="editPrompt(${prompt.id})" class="p-1.5 text-gray-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button onclick="deletePrompt(${prompt.id})" class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </div>
                                <h3 class="text-lg font-bold text-gray-800 mb-2 truncate">${escapeHtml(prompt.title)}</h3>
                                <p class="text-gray-600 text-sm line-clamp-3 mb-2">${escapeHtml(prompt.content)}</p>
                            </div>

                            <div class="text-center text-xs text-gray-400 mt-2 pb-2 border-t border-gray-100 pt-2">
                                <i class="far fa-clock mr-1"></i>最近修改: ${formatTime(prompt.updatedAt)}
                            </div>
                        </div>

                        <div class="p-5 pt-0">
                            <button onclick="copyPrompt(${prompt.id})" class="w-full py-2 bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 rounded-lg text-sm font-medium transition-colors flex items-center justify-center gap-2">
                                <i class="fas fa-copy"></i>
                                复制提示词
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function getCategoryColor(category) {
            const colors = { '编程': 'bg-green-100 text-green-700', '文案': 'bg-purple-100 text-purple-700', '数据分析': 'bg-yellow-100 text-yellow-700' };
            return colors[category] || 'bg-gray-100 text-gray-700';
        }

        function updateCategoryCounts() {
            document.getElementById('count-all').textContent = prompts.length;
            document.getElementById('count-编程').textContent = prompts.filter(p => p.category === '编程').length;
            document.getElementById('count-文案').textContent = prompts.filter(p => p.category === '文案').length;
            document.getElementById('count-数据分析').textContent = prompts.filter(p => p.category === '数据分析').length;
        }

        function filterCategory(category) {
            currentFilter = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.dataset.category === category ? btn.classList.add('bg-gray-700') : btn.classList.remove('bg-gray-700');
            });
            renderCards();
        }

        function openModal() {
            editingId = null;
            document.getElementById('modalTitle').textContent = '新建提示词';
            document.getElementById('promptForm').reset();
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.getElementById('promptTitle').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
            editingId = null;
        }

        function savePrompt() {
            const title = document.getElementById('promptTitle').value.trim();
            const category = document.getElementById('promptCategory').value;
            const content = document.getElementById('promptContent').value.trim();

            if (!title || !category || !content) { showToast('请填写所有必填字段', 'error'); return; }

            if (editingId) {
                const index = prompts.findIndex(p => p.id === editingId);
                if (index !== -1) {
                    // 【新增功能2改动】：编辑时，更新 updatedAt 属性为最新时间戳
                    prompts[index] = { ...prompts[index], title, category, content, updatedAt: Date.now() };
                }
                showToast('提示词已更新！');
            } else {
                const newPrompt = {
                    id: Date.now(),
                    title,
                    category,
                    content,
                    updatedAt: Date.now() // 【新增功能2改动】：新建时，赋予当前时间戳
                };
                prompts.unshift(newPrompt);
                showToast('提示词已创建！');
            }

            saveToLocalStorage();
            renderCards();
            updateCategoryCounts();
            closeModal();
        }

        function editPrompt(id) {
            const prompt = prompts.find(p => p.id === id);
            if (!prompt) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = '编辑提示词';
            document.getElementById('promptTitle').value = prompt.title;
            document.getElementById('promptCategory').value = prompt.category;
            document.getElementById('promptContent').value = prompt.content;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function deletePrompt(id) {
            if (confirm('确定要删除这个提示词吗？')) {
                prompts = prompts.filter(p => p.id !== id);
                saveToLocalStorage();
                renderCards();
                updateCategoryCounts();
                showToast('提示词已删除');
            }
        }

        function copyPrompt(id) {
            const prompt = prompts.find(p => p.id === id);
            if (!prompt) return;
            navigator.clipboard.writeText(prompt.content).then(() => {
                showToast('提示词已复制到剪贴板！');
            }).catch(() => { showToast('复制失败，请手动复制', 'error'); });
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').textContent = message;
            toast.className = 'fixed bottom-6 right-6 px-6 py-3 rounded-lg shadow-lg transform transition-all duration-300 z-50 ' + (type === 'error' ? 'bg-red-600 text-white' : 'bg-gray-800 text-white');
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
        }

        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

        document.getElementById('modal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
    </script>
</body>
</html>
